[tools]
cloudflared = "latest"
cocogitto = "latest"
rust = "1.96"

# --- setup -------------------------------------------------------------------

[tasks.install]
description = "Build the project (compile dependencies)"
run = "cargo build"

[tasks.build]
description = "Build an optimized release binary"
run = "cargo build --release"

# --- webhook server ----------------------------------------------------------

[tasks.serve]
description = "Run the webhook server (luxa.yaml)"
run = "cargo run -q -- serve"

[tasks.tunnel]
description = "Expose the webhook port via cloudflared and print the public URL"
run = "sh scripts/tunnel.sh"

[tasks.health]
description = "Check the running server's health endpoint"
run = "curl -fsS http://127.0.0.1:8765/health"

[tasks.incident]
description = "Trigger the 'incident' webhook on the running server"
run = "curl -fsS -X POST http://127.0.0.1:8765/webhook/incident"

# --- direct device control ---------------------------------------------------

[tasks.flash]
description = "Flash the Luxafor (red by default)"
run = "cargo run -q -- flash"

[tasks.blink]
description = "Blink the Luxafor (red by default)"
run = "cargo run -q -- blink"

[tasks.off]
description = "Turn the Luxafor off"
run = "cargo run -q -- off"

[tasks.behaviors]
description = "List the behaviors available to webhooks"
run = "cargo run -q -- behaviors"

[tasks.colors]
description = "List the built-in colour names"
run = "cargo run -q -- colors"

[tasks.demo]
description = "Cycle through a few effects on the device"
run = """
cargo build -q
target/debug/luxa color red
sleep 1
target/debug/luxa flash blue --repeat 5
target/debug/luxa blink green --times 3
target/debug/luxa off
"""

# --- code quality ------------------------------------------------------------

[tasks.lint]
description = "Lint with clippy (warnings as errors)"
run = "cargo clippy -- -D warnings"

[tasks.fmt]
description = "Format the source with rustfmt"
run = "cargo fmt"

[tasks.test]
description = "Run the test suite"
run = "cargo test"

[tasks.docs]
description = "Serve the documentation site locally (mkdocs)"
run = "uvx --with mkdocs-material mkdocs serve"

# --- systemd (user) services -------------------------------------------------

[tasks.install-service]
description = "Install + enable luxa systemd user services (server + tunnel)"
run = "sh scripts/install-systemd.sh"

[tasks.uninstall-service]
description = "Remove the luxa systemd user services"
run = "sh scripts/uninstall-systemd.sh"
