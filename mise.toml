[tools]
cloudflared = "latest"
python = "3.12"
uv = "latest"

[env]
# Keep the virtualenv inside the project directory
UV_PROJECT_ENVIRONMENT = ".venv"

# --- setup -------------------------------------------------------------------

[tasks.install]
description = "Install dependencies with uv"
run = "uv sync"

# --- webhook server ----------------------------------------------------------

[tasks.serve]
description = "Run the webhook server (luxa.yaml)"
run = "uv run luxa serve"

[tasks.tunnel]
description = "Expose the webhook port via cloudflared and print the public URL"
run = """
port="${LUXA_PORT:-8765}"
log="$(mktemp)"
cloudflared tunnel --url "http://127.0.0.1:${port}" > "$log" 2>&1 &
cf=$!
trap 'kill $cf 2>/dev/null' EXIT INT TERM
echo "starting cloudflared tunnel -> http://127.0.0.1:${port} ..."
url=""
for i in $(seq 1 60); do
  url=$(grep -oE 'https://[a-z0-9-]+\\.trycloudflare\\.com' "$log" | head -1)
  [ -n "$url" ] && break
  kill -0 $cf 2>/dev/null || break
  sleep 0.5
done
if [ -n "$url" ]; then
  echo ""
  echo "🌐 Public URL: $url"
  echo "   Trigger:    curl -X POST $url/webhook/incident"
  echo "   (Ctrl-C to stop the tunnel)"
  echo ""
else
  echo "Could not detect the tunnel URL; cloudflared output:"
  cat "$log"
fi
wait $cf
"""

[tasks.health]
description = "Check the running server's health endpoint"
run = "curl -fsS http://127.0.0.1:8765/health"

[tasks.incident]
description = "Trigger the 'incident' webhook on the running server"
run = "curl -fsS -X POST http://127.0.0.1:8765/webhook/incident"

# --- direct device control ---------------------------------------------------

[tasks.flash]
description = "Flash the Luxafor (red by default)"
run = "uv run luxa flash"

[tasks.blink]
description = "Blink the Luxafor (red by default)"
run = "uv run luxa blink"

[tasks.off]
description = "Turn the Luxafor off"
run = "uv run luxa off"

[tasks.behaviors]
description = "List the behaviors available to webhooks"
run = "uv run luxa behaviors"

[tasks.colors]
description = "List the built-in colour names"
run = "uv run luxa colors"

[tasks.demo]
description = "Cycle through a few effects on the device"
run = """
uv run luxa color red
sleep 1
uv run luxa flash blue --repeat 5
uv run luxa blink green --times 3
uv run luxa off
"""

# --- code quality (ruff via uvx, no project dependency) ----------------------

[tasks.lint]
description = "Lint the source with ruff"
run = "uvx ruff check src"

[tasks.fmt]
description = "Format the source with ruff"
run = "uvx ruff format src"
