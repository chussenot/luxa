name: Release

# Push a tag like v0.1.0 to build binaries and publish a GitHub release.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          name="luxa-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md luxa.example.yaml 99-luxafor.rules "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/luxa.exe" "$name/"
            7z a "$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/luxa" "$name/"
            tar czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: luxa-${{ matrix.target }}
          path: |
            luxa-*.tar.gz
            luxa-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum luxa-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" luxa-* SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --generate-notes \
            --notes "Only the Linux builds are tested against real hardware. The macOS and Windows builds are provided as-is."
