[package]
name = "luxa"
version = "0.1.0"
edition = "2021"
description = "A CLI and webhook server to control a Luxafor Flag"

[[bin]]
name = "luxa"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
nusb = "0.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "signal"] }
