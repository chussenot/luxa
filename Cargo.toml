[package]
name = "luxa"
version = "0.1.0"
edition = "2021"
description = "A CLI and webhook server to control a Luxafor Flag"

[[bin]]
name = "luxa"
path = "src/main.rs"

[dependencies]
axum = "=0.8.9"
clap = { version = "=4.6.7", features = ["derive"] }
nusb = "=0.2.9"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yaml = "=0.9.34"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# localhost-only client; no TLS needed
ureq = { version = "=3.5.1", default-features = false, features = ["json"] }
