[project]
name = "luxa"
version = "0.1.0"
description = "A Typer CLI and webhook server to control a Luxafor Flag"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "hidapi>=0.14",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.scripts]
luxa = "luxa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luxa"]
