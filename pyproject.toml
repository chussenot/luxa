[project]
name = "luxa"
version = "0.1.0"
description = "A Typer CLI to control a Luxafor Flag (flash, blink, colors, off)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "hidapi>=0.14",
]

[project.scripts]
luxa = "luxa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luxa"]
